<style>
:root {
  --bg: #ffffff;
  --fg: #1a1a1a;
  --muted: #6a737d;
  --border: #e5e5e5;
  --code-bg: #f6f8fa;
  --code-fg: #24292e;
  --link: #0366d6;
  --accent: #0969da;
  --table-head: #f6f8fa;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117;
    --fg: #e6edf3;
    --muted: #8b949e;
    --border: #30363d;
    --code-bg: #161b22;
    --code-fg: #c9d1d9;
    --link: #2f81f7;
    --accent: #58a6ff;
    --table-head: #161b22;
  }
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  font-family: -apple-system, "Pretendard Variable", "Pretendard",
    "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI",
    system-ui, BlinkMacSystemFont, Roboto, sans-serif;
  background: var(--bg);
  color: var(--fg);
  line-height: 1.7;
  max-width: 920px;
  margin: 2rem auto;
  padding: 0 1.25rem 4rem;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
h1, h2, h3, h4, h5, h6 {
  line-height: 1.3;
  margin: 1.8em 0 0.5em;
  font-weight: 700;
}
h1 { font-size: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
h2 { font-size: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
h3 { font-size: 1.2rem; }
h4 { font-size: 1.05rem; }
p { margin: 0.75em 0; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
code {
  font-family: "D2Coding", "Cascadia Code", "JetBrains Mono",
    Consolas, "Liberation Mono", monospace;
  background: var(--code-bg);
  color: var(--code-fg);
  padding: 0.12em 0.32em;
  border-radius: 4px;
  font-size: 0.92em;
}
pre {
  background: var(--code-bg);
  border: 1px solid var(--border);
  padding: 1em;
  border-radius: 6px;
  overflow: auto;
  line-height: 1.5;
}
pre code { background: transparent; padding: 0; font-size: 0.9em; color: var(--code-fg); }
blockquote {
  border-left: 3px solid var(--border);
  padding: 0 1em;
  color: var(--muted);
  margin: 1em 0;
}
table {
  border-collapse: collapse;
  margin: 1em 0;
  width: 100%;
  overflow: auto;
  display: block;
}
table thead { background: var(--table-head); }
th, td {
  border: 1px solid var(--border);
  padding: 0.5em 0.75em;
  text-align: left;
  vertical-align: top;
}
hr { border: 0; border-top: 1px solid var(--border); margin: 2em 0; }
ul, ol { padding-left: 1.6em; }
li { margin: 0.25em 0; }
img { max-width: 100%; height: auto; }
.task-list-item { list-style-type: none; margin-left: -1.4em; }
.task-list-item input[type=checkbox] { margin-right: 0.4em; }
</style>
